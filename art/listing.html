<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libertinus+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
body { width: 2560px; height: 1440px; overflow: hidden; font-family: "Libertinus Sans", system-ui, sans-serif; color: #1c1917;
  background: radial-gradient(1400px 900px at 85% 20%, #fde7c2 0%, transparent 60%), linear-gradient(160deg, #fffaf2 0%, #fbf1e1 100%); position: relative; }
.copy { position: absolute; left: 150px; top: 230px; width: 660px; }
.kicker { font-size: 34px; letter-spacing: .14em; text-transform: uppercase; color: #b45309; font-weight: 700; margin-bottom: 34px; }
h1 { font-size: 132px; line-height: .98; letter-spacing: -.02em; font-weight: 700; }
p { font-size: 42px; line-height: 1.32; color: #57534e; margin-top: 44px; }
.pills { display: flex; gap: 16px; margin-top: 64px; flex-wrap: wrap; }
.pills span { font-size: 30px; font-weight: 700; padding: 12px 26px; border-radius: 999px; background: #fff; border: 2px solid #f1dcc0; color: #92400e; }
.shot { position: absolute; border-radius: 28px; overflow: hidden; box-shadow: 0 50px 120px -30px rgba(120, 70, 10, .35), 0 0 0 2px rgba(120, 70, 10, .08); background: #fff; }
.inbox { left: 980px; top: 150px; width: 1720px; height: 1075px; background: url(inbox-light.png) 0 0 / 1720px auto no-repeat; }
.sheet { left: 900px; top: 450px; width: 535px; height: 946px; background: url(sheet-light.png) -28px -33px / 1720px auto no-repeat; border-radius: 24px; }
</style></head><body>
<div class="copy">
  <div class="kicker">Filament plugin</div>
  <h1>Filament Feedback</h1>
  <p>People tag the part of the app they mean and how they feel. The team replies in a thread, and a board shows how a release landed.</p>
  <div class="pills"><span>Filament 3 · 4 · 5</span><span>Light &amp; dark</span><span>Google Chat</span></div>
</div>
<div class="shot inbox"></div>
<div class="shot sheet"></div>
</body></html>
